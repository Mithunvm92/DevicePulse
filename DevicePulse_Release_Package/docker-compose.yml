services:
  api:
    build: ./backend
    container_name: devicepulse-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${DEVICEPULSE_API_PORT:-8081}:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MQTT_HOST: ${MQTT_HOST:-test.mosquitto.org}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-devicepulse/kiosk/heartbeat}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  db:
    image: postgres:16-alpine
    container_name: devicepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - devicepulse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
  dashboard:
    image: nginx:alpine
    container_name: devicepulse-dashboard
    restart: unless-stopped
    ports:
      - "${DEVICEPULSE_DASHBOARD_PORT:-8082}:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    security_opt:
      - no-new-privileges:true
volumes:
  devicepulse_db_data:
